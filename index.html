<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Someone Special ❤️</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Animated Background -->
    <div class="gradient"></div>

    <!-- Stars -->
    <div class="stars"></div>

    <!-- Moon -->
    <div class="moon"></div>

    <!-- Floating Hearts -->
    <div class="heart h1">❤</div>
    <div class="heart h2">❤</div>
    <div class="heart h3">❤</div>
    <div class="heart h4">❤</div>
    <div class="heart h5">❤</div>

    <!-- Shooting Stars -->
    <span class="shooting-star s1"></span>
    <span class="shooting-star s2"></span>
    <span class="shooting-star s3"></span>

    <!-- Hero -->
    <section class="hero">

        <div class="glass">

            <p class="tag">
                ✨ Just For You ✨
            </p>

            <h1>

                Hi Beautiful

                <span>❤️</span>

            </h1>

            <p class="description">

                I wanted to create something that is only ours.

                A place where every click reminds you how much you mean to me.

            </p>

            <a href="password.html" class="btn">

                Begin Our Journey

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </div>

    </section>

    <!-- Music Button -->

    <div class="music">

        <i class="fa-solid fa-music"></i>

    </div>

    <!-- Scroll Down Indicator -->

    <div class="scroll-indicator">

        <span></span>

    </div>

    <!-- Canvas -->
    <canvas id="particles"></canvas>

    <script src="js/script.js"></script>

</body>

</html>
