<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Unlock My Heart ❤️</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="password-page">

<div class="gradient"></div>
<div class="stars"></div>
<div class="moon"></div>

<div class="password-card">

    <div class="lock-icon">

        <i class="fa-solid fa-heart"></i>

    </div>

    <h1>

        Unlock My Heart ❤️

    </h1>

    <p>

        Only someone who knows our special date
        can continue...

    </p>

    <input

        id="password"

        type="password"

        placeholder="DDMMYYYY"

    >

    <button

        onclick="checkPassword()"

        class="btn">

        <i class="fa-solid fa-lock-open"></i>

        Unlock

    </button>

    <p class="hint">

        Hint:
        Jis din hamari story shuru hui ❤️

    </p>

    <p

        id="message"

        class="message">

    </p>

</div>

<script src="script.js"></script>

</body>

</html>
